name: astrbot_plugin_zm_qqgroupmgr
display_name: ZM-QQGroupmgr
version: 1.0.5
author: ZM
desc: |
  ### 一个插件，顶十个 —— AstrBot 全能 QQ 群管理套件

  **26 组指令 · 10 大模块 · 从禁言踢人到敏感词、刷屏、广告、文件分发、跨群批量操作，一站装完**

  ---

  ## 👀 一眼看懂它能干什么

  | 模块 | 能力 | 核心指令 |
  | :--- | :--- | :--- |
  | 🔨 **成员管理** | 禁言 / 解禁 / 全体禁言 / 禁言列表与剩余时长 / 踢人 / 按不活跃天数清理 / 封禁并自动拒绝加群 / 收放管理员 | `/mute` `/muteall` `/mutelist` `/kick` `/ban` `/op` |
  | 💬 **消息管理** | 回复即撤 / 批量撤回最近 N 条 / 从协议端拉群历史（连机器人自己和插件启动前的消息也能撤） | `/recall` |
  | 🚫 **敏感词** | 命中即撤回 + 禁言，时长按群独立设置；自定义词 / 远程词库 / 混合三种词源；白名单纠偏 | `/sw` |
  | 🌊 **刷屏检测** | 滑动窗口条数 + 连续重复内容双重判定，阈值可调，按群开关 | `/antiflood` |
  | 🏷️ **名片检测** | 扫群名片里的广告与敏感内容，处理方式可选 warn / reset / mute / kick | `/cardcheck` |
  | 🛡️ **广告拦截** | 评分制多维度判定（广告短语 + 联系方式 + 手机号 + 外链 + 促销词），越过阈值自动撤回禁言 | `/adban` `/ad` |
  | 📁 **文件仓库** | 上传入库 → 签发**限时下载链接** → 内置 HTTP 服务分发；带下载冷却和版本更新日志 | `/file` `/f dl` |
  | 🎫 **群资料管理** | 改群名、换群头像，**群号用 `-` 连接即可跨群批量**（单次上限 20 群），换完自动撤图 | `/g nn` `/g pp` |
  | 📢 **公告与迎送** | 发群公告（可置顶、可配图）、入群欢迎、退群提示（可带图），全部支持占位符 | `/bc` `/wel` `/bye` |
  | 🎮 **趣味工具** | 群专属头衔、合并转发伪造聊天记录、赛博击杀跨群播报、Minecraft 史莱姆区块查找 | `/title` `/merge` `/kill` `/sf` |

  **不用装五个插件拼一套群管。** 装一个，`/zmhelp` 一条条开。

  ---

  ## 🎯 为什么选 ZM-QQGroupmgr

  | 差异点 | 常见群管插件 | ZM-QQGroupmgr |
  | :--- | :--- | :--- |
  | **跨群批量** | 一个群一条指令，10 个群刷 10 次 | ✅ `/g nn 统一群名 3366-1009-10032` —— 群号 `-` 连接，改名 / 换头像一次搞定，单次最多 20 群 |
  | **批量撤回** | 只能撤插件运行期间内存里记的消息，机器人自己发的撤不掉 | ✅ 优先走协议端 `get_group_msg_history`，**插件启动前的历史消息、机器人自己的消息一样撤** |
  | **文件分发** | 要么没有，要么直接甩群文件，链接永久裸奔 | ✅ 内置文件仓库 + HTTP 服务：**限时令牌链接**、按人下载冷却、版本更新日志，上传后自动从群里清掉源文件 |
  | **敏感词** | 一份写死的词库，全局一个禁言时长 | ✅ 三种词源自由切换 + **白名单纠偏** + **每群独立禁言时长**，远程词库热更新 `/sw reload` |
  | **图片类操作** | 必须一条消息带图，手机端很难操作 | ✅ 换头像 / 发带图公告 / 设退群图，**不带图也行** —— 机器人等你 1 分钟内补发，成功后自动撤图不留痕 |
  | **依赖与体积** | 拉一堆三方库，或者起独立数据库 | ✅ **零额外依赖**，全异步实现，约 1.8k 行核心代码好读好改 |
  | **指令手感** | 指令又长又要背 | ✅ 全量缩写：`/g` `/bc` `/sw` `/f` `/af` `/cc` `/sf`，还有中文别名 `/群管帮助` `/退群提示` |

  ---

  ## 🚀 快速开始

  1. 插件市场安装，或 `git clone https://github.com/ZomebieMask/astrbot_plugin_zm_qqgroupmgr.git` 到 `data/plugins`
  2. 把机器人设为**群管理员**（设管理员 / 设头衔等功能需**群主**）
  3. 按需开功能：

  ```
  /zmhelp              # 看全部指令
  /sw on 10            # 敏感词，命中禁言 10 分钟
  /antiflood on        # 刷屏检测
  /adban on            # 广告拦截
  /wel set 欢迎 {at}！  # 入群欢迎
  ```

  > 所有开关**按群独立**，一个群开了不影响别的群。

  ---

  ## 📖 指令一览

  > 🔒 管理类指令仅 **AstrBot 管理员** 可用。对全体群成员开放的只有 `/file download`、`/file list`、`/file log`（查看）、`/merge`、`/slimefinder`。
  > ⏱️ 时长单位：`s` 秒 · `m` 分 · `h` 时 · `d` 天。

  **🔨 成员管理**

  | 指令 | 说明 |
  | :--- | :--- |
  | `/mute <成员> [时长]` / `/unmute <成员>` | 禁言 / 解除禁言 |
  | `/mutelist` | 本群在禁成员 + 各自剩余时长 |
  | `/muteall [时长\|off]` | 全体禁言，不带参数默认永久 |
  | `/kick <成员>` / `/kick <时间>` | 踢出成员 / 清理该时间内未发言的成员（如 `/kick 20d`） |
  | `/ban <成员>` / `/unban <QQ号>` / `/banlist` | 封禁并踢出（之后自动拒绝加群）/ 解封 / 查看 |
  | `/op <成员>` / `/deop <成员>` | 设置 / 取消群管理员 |
  | `/title @成员 <文本>` | 群专属头衔（QQ 通常只允许群主操作） |

  **💬 消息撤回**

  | 指令 | 说明 |
  | :--- | :--- |
  | `/recall` | 回复某条消息后使用，撤回被回复的那条 |
  | `/recall <数量> [是否含机器人]` | 撤回最近 N 条，第二参数 `false` 则跳过机器人自己的消息 |

  **🚫 敏感词 · 刷屏 · 名片**

  | 指令 | 说明 |
  | :--- | :--- |
  | `/sw on [时长]` / `/sw off` | 开关本群拦截，时长**默认单位分钟**（改时长需先 off 再 on） |
  | `/sw add <词>` / `/sw del <词>` / `/sw list` | 自定义词库增删查 |
  | `/sw mode <custom\|library\|both>` / `/sw reload` | 切换词源 / 重拉远程词库 |
  | `/antiflood on\|off`（`/af`） | 刷屏检测，阈值在后台配置 |
  | `/cardcheck on\|off`（`/cc`） | 群名片检测，违规处理方式在后台配置 |

  **🛡️ 广告**

  | 指令 | 说明 |
  | :--- | :--- |
  | `/adban on\|off` | 广告拦截开关（评分制，阈值 `ad_threshold` 默认 6） |
  | `/ad` / `/ad set <文本>` / `/ad clear` / `/ad reset` | 发布 / 保存 / 清空 / 恢复本群广告 |

  **📁 文件仓库**（`/file` 缩写 `/f`）

  | 指令 | 说明 |
  | :--- | :--- |
  | `/file upload <name> <时长>` | 上传，执行后紧接着发送文件即入库，`<时长>` 为链接有效期 |
  | `/file download <name>`（`/f dl`） | 取限时下载链接，**全体可用但只能私聊机器人** |
  | `/file download cdreset <成员>` | 重置该成员的下载冷却 |
  | `/file log <name> [次数]` / `/file log update <name> <版本> <说明>` | 查看 / 记录版本更新日志 |
  | `/file list` / `/file delete <name>` | 查看全部 / 删除 |

  **🎫 群资料（跨群批量）· 📢 公告迎送**

  | 指令 | 说明 |
  | :--- | :--- |
  | `/group newname <文本> [群号]`（`/g nn`） | 改群名，群号用 `-` 连接可批量 |
  | `/group pp [图片] [群号]`（`/g avatar`） | 改群头像，未附图则等待 1 分钟内补发 |
  | `/broadcast <内容> <true\|false>`（`/bc`） | 发群公告，第二参数为是否置顶，可插图 |
  | `/wel set <文本>` / `on` / `off` / `reset` / `status` | 入群欢迎 |
  | `/bye set <文本>` / `image` / `on` / `off` / `reset` / `status` | 退群提示，可附图片 |

  **🎮 其他**

  | 指令 | 说明 |
  | :--- | :--- |
  | `/merge <标题> <QQ> <内容> [...]` | 构造合并聊天记录，标题即卡片名 |
  | `/kill <成员> <理由>` | 赛博击杀：在与该成员的共同群同步播报 |
  | `/slimefinder <版本> <种子>`（`/sf`） | Minecraft 史莱姆区块查找 |
  | `/zmhelp`（`/群管帮助`） | 全部指令总览，菜单内容可在后台 `help_menu_text` 自定义 |

  ---

  ## 🔤 占位符

  广告、欢迎、退群提示、头衔、击杀模板等文本里通用：
  `{at}` @该用户 · `{name}` 昵称 · `{user_id}` QQ 号 · `{group_id}` 群号 ·
  `{reason}` 退群原因（退群提示专用）· `{operator}` 执行操作的管理员

  ---

  ## ⚙️ 配置项

  运行数据**按群独立**保存在插件数据目录（封禁列表、广告与欢迎文本、各功能开关、自定义敏感词、文件仓库与更新日志），用指令设置即可。后台插件配置面板可调：

  | 分组 | 配置键 |
  | :--- | :--- |
  | 🌊 刷屏判定 | `flood_threshold` `flood_window` `flood_repeat_limit` `flood_mute_duration` `flood_recall` `flood_tip` |
  | 🚫 敏感词 | `sensitive_default_duration` `sensitive_library_urls` `sensitive_whitelist` `sensitive_tip` |
  | 🏷️ 名片检测 | `card_check_enabled` `card_ad_threshold` `card_action` `card_mute_duration` `card_tip` |
  | 🛡️ 广告拦截 | `ad_threshold` `ad_mute_duration` `ad_tip` |
  | 📁 文件服务 | `file_server_enabled` `file_host` `file_port` `file_base_url` `file_default_ttl` `file_download_cooldown` `file_cooldown_tip` `file_private_only_tip` `file_link_expired_tip` |
  | ☠️ 赛博击杀 | `kill_template` `kill_notify_all_groups` |
  | 🖼️ 图片交互 | `media_wait_timeout` `avatar_recall` `broadcast_recall` `farewell_recall` |
  | 📜 帮助菜单 | `help_menu_text`（留空用内置菜单；支持 `{name}` `{version}` `{cooldown}`） |

  ### 🔐 下载服务安全提醒

  内置下载服务**不做身份校验**，仅凭一次签发的限时令牌访问，且不提供目录浏览。`file_host` 默认 `0.0.0.0`（监听所有网卡）——**若不需要公网访问，请改为 `127.0.0.1`**，或用防火墙 / 反向代理限制来源。

  ---

  ## ❓ 常见问题

  - **指令没反应？** 确认 ① 你是 AstrBot 管理员 ② 机器人在该群是管理员或群主 ③ 协议端是 `aiocqhttp` / `nakuru`
  - **设头衔失败？** QQ 侧限制：群专属头衔通常只有群主能设
  - **敏感词误伤？** 后台 `sensitive_whitelist` 加白名单，或 `/sw mode custom` 只用自维护词库
  - **数据会丢吗？** 封禁列表、各类文本与开关永久保存重启不丢；仅批量撤回用的消息历史是内存缓存
  - **批量会被风控吗？** 频繁操作可能触发 QQ 风控，群资料批量单次上限 20 群就是为此设的

