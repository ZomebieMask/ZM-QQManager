name: ZM-QQManager
display_name: ZM-QQManager
version: 1.0.0
author: ZM
desc: |
  功能强大的 QQ 群管理插件，提供全方位的群管理功能：

  ## 核心功能
  - **禁言管理**: 支持自定义禁言时长（天/周/月/年）
  - **成员管理**: 踢出、封禁、解封、设置管理员
  - **消息管理**: 撤回消息（单条或批量）
  - **广告管理**: 智能广告检测与拦截、自定义群广告
  - **欢迎系统**: 可自定义的入群欢迎消息
  - **头衔管理**: 设置群成员专属头衔
  - **活跃度管理**: 自动清理不活跃成员
  - **我的世界工具**: 史莱姆区块查找器

  ## 命令列表
  - `/mute <成员> [时间]` - 禁言指定成员
  - `/kick <成员>` - 踢出群成员
  - `/kick <时间>` - 清理不活跃成员
  - `/ban <成员>` - 封禁并踢出
  - `/unban <QQ号>` - 解除封禁
  - `/recall` - 撤回消息
  - `/ad` - 广告管理（发布/设置/清除）
  - `/adban` - 广告拦截开关
  - `/wel` - 欢迎消息管理
  - `/title` - 设置群头衔
  - `/op` / `/deop` - 管理员管理
  - `/slimefinder` - 史莱姆区块查找

  支持 {at}、{name}、{user_id}、{group_id} 占位符。
  广告检测采用智能评分机制，综合判断多种广告特征。
short_desc: 功能全面的 QQ 群管理插件，支持禁言、踢人、封禁、广告拦截、欢迎消息等
