name: astrbot_plugin_zm_qqmanager
display_name: ZM-QQManager
version: 1.0.4
author: ZM
desc: |
  功能强大的 QQ 群管理插件，提供全方位的群管理功能：

  ## 核心功能
  - **禁言管理**: 单人禁言、全体禁言、禁言列表与剩余时长查询
  - **敏感词系统**: 自动撤回并禁言，支持自定义词库 / 远程词库 / 混合模式
  - **刷屏检测**: 滑动窗口 + 重复消息判定，可按群开关
  - **名片检测**: 检测群名片中的广告与敏感内容
  - **成员管理**: 踢出、封禁、解封、设置管理员
  - **消息管理**: 撤回消息（单条或批量）
  - **文件仓库**: 上传文件、临时下载链接、更新日志
  - **群资料管理**: 修改群名称与群头像，支持跨群批量操作
  - **群公告**: 发布群公告，可置顶、可配图
  - **合并转发**: 构造合并聊天记录
  - **赛博击杀**: 跨群同步播报，模板可在后台配置
  - **广告管理**: 智能广告检测与拦截、自定义群广告
  - **迎送系统**: 可自定义的入群欢迎与退群提示（退群提示可带图片）
  - **头衔管理**: 设置群成员专属头衔
  - **活跃度管理**: 自动清理不活跃成员
  - **我的世界工具**: 史莱姆区块查找器

  ## 命令列表
  - `/mute <成员> [时长]` - 禁言指定成员
  - `/unmute <成员>` - 解除禁言
  - `/mutelist` - 查看禁言列表与剩余时长
  - `/muteall [时长]` - 全体禁言，默认永久；`/muteall off` 解除
  - `/sw on [时长]` / `/sw off` - 敏感词开关（默认单位分钟）
  - `/sw add|del|list|mode|reload` - 敏感词库管理
  - `/antiflood on|off` - 刷屏检测开关
  - `/cardcheck on|off` - 群名片检测开关
  - `/file upload|download|log|list|delete` - 文件仓库（`/file` 缩写 `/f`）
  - `/file log update <name> <version> <内容>`（缩写 `/f l up`）- 更新已上传目标文件的版本字段，内容为补充解释更新内容
  - `/file download cdreset <成员>`（缩写 `/f dl cdreset`）- 重置成员的下载冷却
  - `/group newname <文本> [qq群号]`（缩写 `/g nn`）- 修改群名称，群号可用 `-` 连接批量
  - `/group pp [图片] [qq群号]`（缩写 `/g avatar`）- 修改群头像，未附图则等待 1 分钟内补发
  - `/broadcast <内容> <是否置顶公告>`（缩写 `/bc`）- 发布群公告，可插图
  - `/bye set|image|image clear|on|off|reset|status` - 退群提示，可带图片
  - `/merge <title> <qq> <内容> [...]` - 构造合并转发
  - `/kill <成员> <理由>` - 赛博击杀播报
  - `/kick <成员>` / `/kick <时间>` - 踢出成员 / 清理不活跃成员
  - `/ban <成员>` / `/unban <QQ号>` / `/banlist` - 封禁管理
  - `/recall [数量]` - 撤回消息
  - `/ad` / `/adban` - 广告管理与拦截开关
  - `/wel` - 欢迎消息管理
  - `/title` - 设置群头衔
  - `/op` / `/deop` - 管理员管理
  - `/slimefinder` - 史莱姆区块查找
  - `/zmhelp` - 查看全部命令

  管理命令仅 AstrBot 管理员可用；`/file download`（简写 `/f dl`，仅私聊可用）、
  `/file list`、`/file log` 查看对全体群成员开放。
  时长单位: s 秒 / m 分钟 / h 小时 / d 天。
  支持 {at}、{name}、{user_id}、{group_id} 占位符。
short_desc: 功能全面的 QQ 群管理插件，支持禁言、敏感词、刷屏检测、文件仓库、广告拦截等
